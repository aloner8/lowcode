events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. App แม่ (DesignMode Studio) -> Port 33000
    server {
        listen 80;
        server_name studio.mydomain.com studio.localhost;

        location / {
            proxy_pass http://host.docker.internal:33000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 2. App ลูก Client A -> Port 33001
    server {
        listen 80;
        server_name client-a.mydomain.com client-a.localhost;

        location / {
            proxy_pass http://host.docker.internal:33001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 3. App ลูก Client B -> Port 33002
    server {
        listen 80;
        server_name client-b.mydomain.com client-b.localhost;

        location / {
            proxy_pass http://host.docker.internal:33002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
