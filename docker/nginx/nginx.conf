# Baseline reverse-proxy config.
# Regenerate from the live site registry (includes every tenant domain) with:
#   curl -s -b cookies.txt "http://localhost:33000/api/nginx-config" > docker/nginx/nginx.conf
# See src/lib/engine/NginxConfigGenerator.ts

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 20m;
    server_tokens off;

    # Unknown hosts get a flat 404 rather than falling through to a real site.
    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }

    # Control plane (DesignMode Studio)
    server {
        listen 80;
        server_name studio.localhost localhost;

        location / {
            proxy_pass http://studio-mother:33000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
