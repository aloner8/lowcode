services:
  # 1. Central PostgreSQL for the Mother Web control plane.
  # Stores platform blueprints, design metadata, users, tenant app registry and
  # the publishable definitions that are copied into each tenant database.
  core-db:
    image: postgres:17-alpine
    container_name: lowcode_core_db
    restart: unless-stopped
    ports:
      - "35432:5432"
    environment:
      POSTGRES_DB: ${CORE_POSTGRES_DB:-lowcode_core}
      POSTGRES_USER: ${CORE_POSTGRES_USER:-lowcode_admin}
      POSTGRES_PASSWORD: ${CORE_POSTGRES_PASSWORD:-lowcode_dev_password}
      TZ: Asia/Bangkok
    volumes:
      - lowcode_core_postgres_data:/var/lib/postgresql/data
      # Whole directory is mounted so migrations stay in sync automatically.
      # Postgres runs *.sql from this directory in filename order on first init.
      - ./docker/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - lowcode-network

  # 2. pgAdmin for managing the central PostgreSQL database.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lowcode_pgadmin
    restart: unless-stopped
    ports:
      - "35433:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@lowcode.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin_dev_password}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - lowcode_pgadmin_data:/var/lib/pgadmin
    depends_on:
      core-db:
        condition: service_healthy
    networks:
      - lowcode-network

  # 3. Mother App (DesignMode Studio & Control Plane)
  studio-mother:
    build:
      context: .
      dockerfile: Dockerfile
    image: lowcode-app:latest
    container_name: lowcode_studio_mother
    # The control plane needs Docker socket access to generate/start Platform runtimes.
    user: root
    restart: always
    ports:
      - "33000:33000"
    environment:
      PORT: 33000
      NODE_ENV: production
      CORE_DATABASE_URL: postgresql://${CORE_POSTGRES_USER:-lowcode_admin}:${CORE_POSTGRES_PASSWORD:-lowcode_dev_password}@core-db:5432/${CORE_POSTGRES_DB:-lowcode_core}
      CORE_DB_SCHEMA: public
      # Sessions are HMAC-signed. There is deliberately no default: a published
      # default is the same as no secret at all. Run `npm run secrets` to create one.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — run "npm run secrets" to generate .env}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      PLATFORM_RUNTIME_NETWORK: lowcode_network
      PLATFORM_RUNTIME_BASE_IMAGE: lowcode-app:latest
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?PLATFORM_JWT_SECRET is required — run "npm run secrets" to generate .env}
      TENANT_STORAGE_ROOT: /app/storage/tenants
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Uploaded files live here, one directory per tenant. Without this volume
      # every upload is lost when the container is recreated.
      - lowcode_tenant_storage:/app/storage/tenants
    depends_on:
      core-db:
        condition: service_healthy
    networks:
      - lowcode-network

  # 4. Multi-site frontend launcher.
  # Reads public.site_registry and starts one Next.js process per tenant site,
  # each bound to its own port and answering its own domain(s).
  sites:
    image: lowcode-app:latest
    container_name: lowcode_sites
    restart: always
    command: ["node", "scripts/run-sites.mjs"]
    ports:
      # One host port per site; widen the range as more sites are provisioned.
      - "33001-33020:33001-33020"
    environment:
      NODE_ENV: production
      SITES_HOSTNAME: 0.0.0.0
      CORE_DATABASE_URL: postgresql://${CORE_POSTGRES_USER:-lowcode_admin}:${CORE_POSTGRES_PASSWORD:-lowcode_dev_password}@core-db:5432/${CORE_POSTGRES_DB:-lowcode_core}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — run "npm run secrets" to generate .env}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?PLATFORM_JWT_SECRET is required — run "npm run secrets" to generate .env}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      TENANT_STORAGE_ROOT: /app/storage/tenants
    volumes:
      # Same store as the control plane, so a file uploaded in Studio is the
      # same file the running site serves.
      - lowcode_tenant_storage:/app/storage/tenants
    depends_on:
      core-db:
        condition: service_healthy
      studio-mother:
        condition: service_started
    networks:
      - lowcode-network

  # 5. Nginx reverse proxy.
  # Regenerate docker/nginx/nginx.conf from the live registry with:
  #   curl -s localhost:33000/api/nginx-config -b cookies.txt > docker/nginx/nginx.conf
  nginx-proxy:
    image: nginx:alpine
    container_name: lowcode_nginx_proxy
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - studio-mother
      - sites
    networks:
      - lowcode-network

volumes:
  lowcode_core_postgres_data:
    name: lowcode_core_postgres_data
  lowcode_pgadmin_data:
    name: lowcode_pgadmin_data
  lowcode_tenant_storage:
    name: lowcode_tenant_storage

networks:
  lowcode-network:
    name: lowcode_network
    driver: bridge
