<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-labelledby="matchanu-logo-title">
  <title id="matchanu-logo-title">MATCHANU — Low-Code Platform</title>
  <defs>
    <linearGradient id="mchnl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C58A9"/>
      <stop offset="0.55" stop-color="#0B4485"/>
      <stop offset="1" stop-color="#083A6E"/>
    </linearGradient>
    <linearGradient id="mchnl-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3A3"/>
      <stop offset="0.45" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#D89000"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#mchnl-bg)"/>
  <path d="M13 44.5 L23.5 21.5 L32 34 L40.5 21.5 L51 44.5"
        fill="none" stroke="url(#mchnl-gold)" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 51.5 Q32 45.5 44 51.5" fill="none" stroke="url(#mchnl-gold)"
        stroke-width="4" stroke-linecap="round" opacity="0.75"/>

  <!-- Falls back gracefully where Anuphan is not installed. -->
  <text x="82" y="34" fill="#0B1F3A" font-size="23" font-weight="700"
        letter-spacing="1.6"
        font-family="Anuphan, 'Noto Sans Thai', system-ui, sans-serif">MATCHANU</text>
  <text x="83" y="49" fill="#5A6473" font-size="10.5" letter-spacing="2.4"
        font-family="Anuphan, 'Noto Sans Thai', system-ui, sans-serif">LOW-CODE PLATFORM</text>
</svg>
