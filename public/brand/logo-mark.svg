<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="matchanu-mark-title">
  <title id="matchanu-mark-title">MATCHANU</title>
  <defs>
    <linearGradient id="mchn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C58A9"/>
      <stop offset="0.55" stop-color="#0B4485"/>
      <stop offset="1" stop-color="#083A6E"/>
    </linearGradient>
    <linearGradient id="mchn-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3A3"/>
      <stop offset="0.45" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#D89000"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#mchn-bg)"/>

  <!-- The peaks read as an M; the sweep beneath them reads as Matchanu's tail.
       Stroked rather than filled so it stays legible down to 16px. -->
  <path d="M13 44.5 L23.5 21.5 L32 34 L40.5 21.5 L51 44.5"
        fill="none" stroke="url(#mchn-gold)" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M20 51.5 Q32 45.5 44 51.5" fill="none" stroke="url(#mchn-gold)"
        stroke-width="4" stroke-linecap="round" opacity="0.75"/>
</svg>
