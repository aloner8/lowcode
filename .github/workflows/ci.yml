name: CI

on:
  push:
    branches: [prod, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lowcode_core
          POSTGRES_USER: lowcode_admin
          POSTGRES_PASSWORD: lowcode_dev_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lowcode_admin -d lowcode_core"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      CORE_DATABASE_URL: postgresql://lowcode_admin:lowcode_dev_password@localhost:5432/lowcode_core
      AUTH_SECRET: ci-secret-value-that-is-at-least-32-characters-long
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply database migrations
        run: |
          for file in docker/postgres/migrations/*.sql; do
            echo "-- applying $file"
            psql "$CORE_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify compiled shared library
        run: node scripts/smoke-sharemodule.mjs

      - name: Build and verify runtime image
        run: |
          PLATFORM_VERSION=$(node -p "require('./package.json').version")
          SHAREMODULE_VERSION=$(node -p "require('./packages/sharemodule/package.json').version")
          docker build \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --build-arg PLATFORM_VERSION="$PLATFORM_VERSION" \
            --build-arg SHAREMODULE_VERSION="$SHAREMODULE_VERSION" \
            -t lowcode-ci:${{ github.sha }} .
          docker run --rm --entrypoint node lowcode-ci:${{ github.sha }} scripts/smoke-sharemodule.mjs --http
          docker run --rm --entrypoint node lowcode-ci:${{ github.sha }} scripts/smoke-worker.mjs
